name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check manifest version matches tag
        run: |
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json says $MANIFEST but tag is ${GITHUB_REF_NAME}"; exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME}" '
            $0 ~ "^## \\[" v "\\]" { p=1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            theme.css
            manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            theme.css
            manifest.json
